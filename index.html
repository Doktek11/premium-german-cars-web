<!doctype html>
<html lang="es">
  <head>
    <!-- =========================
         GLOBAL / BASE (NO DINÁMICO)
         ========================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <base href="/" />

    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Premium German Cars" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- Fallback base (SEO.tsx lo sobreescribe por página) -->
    <title>Premium German Cars</title>

    <!-- Solo metas verdaderamente globales -->
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />


    <!-- Favicon / App icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Performance -->
    <link
      rel="preload"
      as="image"
      href="/amggtr-mobile.webp"
      imagesrcset="/amggtr-mobile-640.webp 640w, /amggtr-mobile-960.webp 960w, /amggtr-mobile-1280.webp 1280w, /amggtr-mobile-1920.webp 1920w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="preload" href="/static-fonts/montserrat-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/static-fonts/playfair-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- CSS crítico base -->
    <style>
      body {
        margin: 0;
        background-color: #050505;
        color: #e5e5e5;
        font-weight: 400; /* importante: evita forzar montserrat-300 en la ruta crítica */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
      }
    </style>

    <!-- ESTRUCTURADO CRÍTICO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoDealer",
        "name": "Premium German Cars",
        "url": "https://www.premiumgermancars.com",
        "logo": "https://www.premiumgermancars.com/favicon.svg",
        "description": "Importación de coches premium desde Alemania con garantía, historial certificado y entrega llave en mano en España.",
        "image": "https://www.premiumgermancars.com/amggtr-mobile.webp",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "ES"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Spain"
        },
        "inLanguage": "es-ES"
      }
    </script>

    <!-- GA4 se carga tras la primera interaccion; la cola conserva page views y conversiones. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function gtag() {
        window.dataLayer.push(arguments);
      };
      window.gtag("js", new Date());

      if (navigator.userAgent !== "ReactSnap") {
        let analyticsLoaded = false;
        const interactionEvents = ["pointerdown", "keydown", "scroll"];

        const loadAnalytics = () => {
          if (analyticsLoaded) return;
          analyticsLoaded = true;

          interactionEvents.forEach((eventName) => {
            window.removeEventListener(eventName, loadAnalytics);
          });

          const script = document.createElement("script");
          script.src = "https://www.googletagmanager.com/gtag/js?id=G-8KVXL3SX44";
          script.async = true;
          document.head.appendChild(script);
        };

        interactionEvents.forEach((eventName) => {
          window.addEventListener(eventName, loadAnalytics, {
            once: true,
            passive: true,
          });
        });
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
